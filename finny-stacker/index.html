<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0a0805">
<title>FINNY · Gold Stacker</title>
<style>
  :root{
    --void:#0a0805; --panel:#14100a;
    --gold:#f5c542; --gold-hi:#ffe9a8; --gold-deep:#b9821b;
    --ink:#efe4c6; --dim:#9a8a63; --danger:#e5484d;
  }
  *{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%; overflow:hidden; background:var(--void);}
  body{font-family:ui-monospace,"JetBrains Mono","SF Mono",Menlo,monospace; color:var(--ink); touch-action:manipulation; user-select:none;}
  #wrap{position:fixed; inset:0;}
  canvas{position:absolute; inset:0; display:block;}

  /* HUD */
  .hud{position:absolute; top:0; left:0; right:0; padding:16px 18px; display:flex; justify-content:space-between; align-items:flex-start; pointer-events:none; z-index:3;}
  .brand{display:flex; align-items:center; gap:10px;}
  .brand img{width:38px; height:38px; border-radius:50%; box-shadow:0 0 0 1.5px var(--gold), 0 4px 14px rgba(0,0,0,.5); display:block;}
  .brand .wm{line-height:1;}
  .brand .fn{font-family:Georgia,"Times New Roman",serif; font-weight:700; font-size:20px; letter-spacing:.06em;
    background:linear-gradient(180deg,var(--gold-hi),var(--gold-deep)); -webkit-background-clip:text; background-clip:text; color:transparent;}
  .brand .sub{font-size:9px; letter-spacing:.28em; color:var(--dim); margin-top:3px;}
  .stat{text-align:right;}
  .stat .num{font-size:42px; font-weight:700; line-height:.9; color:var(--gold); text-shadow:0 2px 12px rgba(245,197,66,.35);}
  .stat .best{font-size:10px; letter-spacing:.24em; color:var(--dim); margin-top:6px;}

  /* Perfect flash */
  #flash{position:absolute; left:0; right:0; top:34%; text-align:center; z-index:4; pointer-events:none; opacity:0; transition:opacity .18s;}
  #flash .p{font-family:Georgia,serif; font-size:30px; letter-spacing:.14em; font-weight:700; color:var(--gold-hi); text-shadow:0 0 22px rgba(245,197,66,.7);}
  #flash .cx{font-size:13px; letter-spacing:.3em; color:var(--gold); margin-top:2px;}
  #flash.show{opacity:1;}

  /* Screens */
  .screen{position:absolute; inset:0; z-index:5; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:24px; pointer-events:none;
    background:radial-gradient(120% 90% at 50% 30%, rgba(10,8,5,.35), rgba(10,8,5,.82));}
  .screen.hide{display:none;}
  .screen .cat{width:118px; height:118px; border-radius:50%; box-shadow:0 0 0 2px var(--gold), 0 10px 40px rgba(0,0,0,.6); margin-bottom:22px;}
  .title{font-family:Georgia,"Times New Roman",serif; font-weight:700; letter-spacing:.05em; line-height:.98;}
  .title .big{display:block; font-size:clamp(46px,15vw,86px);
    background:linear-gradient(180deg,var(--gold-hi) 0%,var(--gold) 45%,var(--gold-deep) 100%); -webkit-background-clip:text; background-clip:text; color:transparent;
    filter:drop-shadow(0 3px 0 rgba(0,0,0,.35));}
  .title .small{display:block; font-family:ui-monospace,monospace; font-size:clamp(12px,3.6vw,16px); letter-spacing:.42em; color:var(--gold-deep); margin-top:8px;}
  .lede{max-width:26ch; color:var(--dim); font-size:13px; line-height:1.55; margin-top:20px;}
  .cta{margin-top:26px; font-size:13px; letter-spacing:.16em; color:var(--ink);}
  .cta b{color:var(--gold);}
  .hint{margin-top:14px; font-size:11px; letter-spacing:.2em; color:var(--dim); animation:pulse 1.5s ease-in-out infinite;}
  .bestrow{margin-top:8px; font-size:11px; letter-spacing:.24em; color:var(--dim);}
  .bestrow b{color:var(--gold);}
  .result{font-size:14px; letter-spacing:.18em; color:var(--dim); margin-top:18px;}
  .result .h{font-size:64px; font-weight:700; color:var(--gold); letter-spacing:0; line-height:1; margin:6px 0 2px; text-shadow:0 3px 18px rgba(245,197,66,.4);}
  @keyframes pulse{0%,100%{opacity:.45} 50%{opacity:1}}
  @media (prefers-reduced-motion: reduce){ .hint{animation:none; opacity:.8} }
  .foot{position:absolute; left:0; right:0; bottom:0; z-index:6; display:flex; align-items:center; justify-content:center; gap:9px; padding:9px 12px calc(9px + env(safe-area-inset-bottom)); background:linear-gradient(180deg,rgba(10,8,5,0),rgba(10,8,5,.86)); font-size:11px; letter-spacing:.06em;}
  .foot .tk{font-family:Georgia,serif; font-weight:700; color:var(--gold); letter-spacing:.04em;}
  .foot .ca{font-family:ui-monospace,monospace; color:var(--ink); background:rgba(245,197,66,.08); border:1px solid rgba(245,197,66,.3); border-radius:7px; padding:5px 9px; cursor:pointer; font-size:11px; letter-spacing:.04em;}
  .foot .ca:hover{background:rgba(245,197,66,.16);}
  .foot .ca:active{transform:translateY(1px);}
  .foot .dot{color:var(--dim);}
  .foot .lnk{color:var(--gold); text-decoration:none; font-family:ui-monospace,monospace; padding:5px 6px;}
  .foot .lnk:hover{color:var(--gold-hi);}
</style>
</head>

<script>
(function(){
  "use strict";
  var canvas=document.getElementById('c'), ctx=canvas.getContext('2d');
  var DPR=1, W=0, H=0, groundY=0, baseY=0, baseWidth=0;
  var BAR_H=30;
  var PERFECT_TOL=7;
  var reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  var elScore=document.getElementById('score'),
      elBestHud=document.getElementById('bestHud'),
      elBestStart=document.getElementById('bestStart'),
      elBestOver=document.getElementById('bestOver'),
      elFinalH=document.getElementById('finalH'),
      elFlash=document.getElementById('flash'),
      elCombo=document.getElementById('combo'),
      scStart=document.getElementById('start'),
      scOver=document.getElementById('over');

  // ---- persistent best (guarded for sandboxed previews) ----
  var best=0;
  try{ var s=localStorage.getItem('finny_stacker_best'); if(s) best=parseInt(s)||0; }catch(e){}
  function saveBest(){ try{ localStorage.setItem('finny_stacker_best', String(best)); }catch(e){} }

  var state='start';
  var tower=[], topLevel=0, cur=null, camY=0, score=0, combo=0, speed=170;
  var debris=[], sparks=[], shake=0, flashT=0;

  function layout(){
    groundY = H*0.84;
    baseY = groundY - BAR_H;
    baseWidth = Math.min(W*0.62, 300);
  }
  function resize(){
    DPR = Math.min(window.devicePixelRatio||1, 2);
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = W*DPR; canvas.height = H*DPR;
    canvas.style.width=W+'px'; canvas.style.height=H+'px';
    ctx.setTransform(DPR,0,0,DPR,0,0);
    layout();
  }
  window.addEventListener('resize', resize);

  function screenYForLevel(L){ return baseY - L*BAR_H + camY; }

  function spawnCur(){
    var top=tower[tower.length-1];
    cur={ level: top.level+1, w: top.w, dir:(Math.random()<0.5?1:-1) };
    cur.minX=0; cur.maxX=Math.max(0, W-cur.w);
    cur.x = cur.dir>0 ? cur.minX : cur.maxX;
  }
  function init(){
    tower=[]; debris=[]; sparks=[]; combo=0; score=0; speed=170; camY=0; shake=0;
    var bw=baseWidth;
    tower.push({ level:0, x:(W-bw)/2, w:bw });
    topLevel=0;
    spawnCur();
    elScore.textContent='0';
  }
  function startGame(){ init(); state='play'; scStart.classList.add('hide'); scOver.classList.add('hide'); }
  function gameOver(){
    state='over';
    if(score>best){ best=score; saveBest(); }
    elFinalH.textContent=score; elBestOver.textContent=best; elBestHud.textContent=best;
    scOver.classList.remove('hide');
    beep(150,0.32,'sawtooth',0.06);
    // topple the last bar for drama
    if(cur){ debris.push({x:cur.x,y:screenYForLevel(cur.level),w:cur.w,h:BAR_H,vx:cur.dir*60,vy:-40,rot:0,vr:(Math.random()-0.5)*4,a:1}); }
  }

  function spawnDebris(x,y,w){
    debris.push({x:x,y:y,w:w,h:BAR_H,vx:(Math.random()-0.5)*40, vy:20, rot:0, vr:(Math.random()-0.5)*3, a:1});
  }
  function spawnPerfect(x,w){
    if(reduced) return;
    var cx=x+w/2, cy=screenYForLevel(topLevel+1)+BAR_H/2;
    for(var i=0;i<16;i++){
      var ang=Math.random()*Math.PI*2, sp=60+Math.random()*140;
      sparks.push({x:cx,y:cy,vx:Math.cos(ang)*sp,vy:Math.sin(ang)*sp-40,a:1,r:1.5+Math.random()*2.5});
    }
  }

  function drop(){
    var top=tower[tower.length-1];
    var L=Math.max(cur.x, top.x);
    var R=Math.min(cur.x+cur.w, top.x+top.w);
    var overlap=R-L;
    var yCur=screenYForLevel(cur.level);
    if(overlap<=1){
      // whiff: bar falls, game over
      debris.push({x:cur.x,y:yCur,w:cur.w,h:BAR_H,vx:0,vy:10,rot:0,vr:(Math.random()-0.5)*2,a:1});
      gameOver(); return;
    }
    var nx,nw,perfect=Math.abs(cur.x-top.x)<=PERFECT_TOL;
    if(perfect){
      nx=top.x; nw=top.w; combo++;
      spawnPerfect(nx,nw);
      showFlash(combo);
      beep(660,0.10,'triangle',0.05); setTimeout(function(){beep(990,0.12,'triangle',0.05);},70);
    } else {
      nx=L; nw=overlap; combo=0;
      if(cur.x < L) spawnDebris(cur.x, yCur, L-cur.x);
      if(cur.x+cur.w > R) spawnDebris(R, yCur, (cur.x+cur.w)-R);
      if(!reduced) shake=5;
      beep(230,0.07,'square',0.05);
    }
    tower.push({ level:cur.level, x:nx, w:nw });
    topLevel++; score++; elScore.textContent=score;
    speed=Math.min(430, speed+7);
    spawnCur();
  }

  function showFlash(c){
    elCombo.textContent = c>1 ? ('COMBO ×'+c) : '';
    elFlash.classList.add('show'); flashT=0.5;
  }

  function act(){
    ensureAudio();
    if(state==='start') startGame();
    else if(state==='play') drop();
    else if(state==='over') startGame();
  }
  window.addEventListener('pointerdown', function(e){ act(); }, {passive:true});
  window.addEventListener('keydown', function(e){
    if(e.repeat) return;
    if(e.code==='Space'||e.code==='Enter'){ e.preventDefault(); act(); }
  });

  // ---- tiny audio (guarded) ----
  var ac=null;
  function ensureAudio(){ if(!ac){ try{ ac=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } if(ac&&ac.state==='suspended'){ try{ac.resume();}catch(e){} } }
  function beep(freq,dur,type,vol){ if(!ac) return; try{
      var o=ac.createOscillator(), g=ac.createGain(); o.type=type||'sine'; o.frequency.value=freq;
      var t=ac.currentTime; g.gain.setValueAtTime(vol||0.05,t); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
      o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t+dur+0.02);
  }catch(e){} }

  // ---- drawing ----
  function rr(x,y,w,h,r){ r=Math.min(r,h/2,w/2); ctx.beginPath();
    ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
    ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }

  function drawBar(x,y,w,h,glow){
    if(w<=0) return;
    if(glow){ ctx.save(); ctx.shadowColor='rgba(245,197,66,.55)'; ctx.shadowBlur=18; }
    var g=ctx.createLinearGradient(0,y,0,y+h);
    g.addColorStop(0,'#ffe9a8'); g.addColorStop(0.42,'#f5c542'); g.addColorStop(1,'#a9741a');
    ctx.fillStyle=g; rr(x,y,w,h,4); ctx.fill();
    if(glow) ctx.restore();
    // top highlight
    ctx.fillStyle='rgba(255,255,255,.45)'; rr(x+2,y+2,Math.max(0,w-4),2,1); ctx.fill();
    // bottom shade
    ctx.fillStyle='rgba(90,55,8,.45)'; ctx.fillRect(x+3,y+h-3,Math.max(0,w-6),2);
    // edge
    ctx.strokeStyle='rgba(70,45,8,.55)'; ctx.lineWidth=1; rr(x+.5,y+.5,w-1,h-1,4); ctx.stroke();
  }

  // static chart backdrop
  var candles=[];
  (function makeCandles(){ for(var i=0;i<60;i++){ candles.push({ x:Math.random(), y:Math.random(), h:20+Math.random()*90, up:Math.random()<0.58 }); } })();

  function drawBackdrop(){
    var bg=ctx.createLinearGradient(0,0,0,H);
    bg.addColorStop(0,'#0c0a06'); bg.addColorStop(0.6,'#0a0805'); bg.addColorStop(1,'#070502');
    ctx.fillStyle=bg; ctx.fillRect(0,0,W,H);
    // faint candlesticks, parallax with camera
    ctx.save(); ctx.globalAlpha=0.05;
    for(var i=0;i<candles.length;i++){ var c=candles[i];
      var cx=c.x*W, cy=(c.y*H + camY*0.25) % (H+120) - 60;
      ctx.fillStyle = c.up ? '#f5c542' : '#8a5a1a';
      ctx.fillRect(cx-4, cy, 8, c.h);
      ctx.fillRect(cx-0.5, cy-10, 1, c.h+20);
    }
    ctx.restore();
    // vignette
    var v=ctx.createRadialGradient(W/2,H*0.42,H*0.2, W/2,H*0.5,H*0.85);
    v.addColorStop(0,'rgba(0,0,0,0)'); v.addColorStop(1,'rgba(0,0,0,.55)');
    ctx.fillStyle=v; ctx.fillRect(0,0,W,H);
  }

  function render(){
    ctx.setTransform(DPR,0,0,DPR,0,0);
    drawBackdrop();
    ctx.save();
    if(shake>0){ ctx.translate((Math.random()-0.5)*shake,(Math.random()-0.5)*shake); }

    // tower
    for(var i=0;i<tower.length;i++){ var b=tower[i]; var y=screenYForLevel(b.level);
      if(y> -BAR_H && y<H+BAR_H) drawBar(b.x,y,b.w,BAR_H,false);
    }
    // current sliding bar
    if(state==='play' && cur){ drawBar(cur.x, screenYForLevel(cur.level), cur.w, BAR_H, true); }

    // debris
    for(var d=0; d<debris.length; d++){ var db=debris[d]; if(db.a<=0) continue;
      ctx.save(); ctx.globalAlpha=Math.max(0,db.a); ctx.translate(db.x+db.w/2, db.y+db.h/2); ctx.rotate(db.rot);
      drawBar(-db.w/2,-db.h/2,db.w,db.h,false); ctx.restore();
    }
    // sparks
    for(var p=0;p<sparks.length;p++){ var sp=sparks[p]; if(sp.a<=0) continue;
      ctx.globalAlpha=Math.max(0,sp.a); ctx.fillStyle='#ffe9a8';
      ctx.beginPath(); ctx.arc(sp.x,sp.y,sp.r,0,Math.PI*2); ctx.fill();
    }
    ctx.globalAlpha=1;
    ctx.restore();
  }

  var last=0;
  function loop(ts){
    var dt=Math.min(0.05,(ts-last)/1000)||0; last=ts;
    // update
    if(state==='play' && cur){
      cur.x += cur.dir*speed*dt;
      if(cur.x<=cur.minX){ cur.x=cur.minX; cur.dir=1; }
      if(cur.x>=cur.maxX){ cur.x=cur.maxX; cur.dir=-1; }
      var camTarget=Math.max(0, topLevel*BAR_H - (baseY - H*0.42));
      camY += (camTarget-camY)*Math.min(1,dt*6);
    }
    if(shake>0){ shake=Math.max(0, shake - dt*30); }
    if(flashT>0){ flashT-=dt; if(flashT<=0) elFlash.classList.remove('show'); }
    // debris physics
    for(var i=0;i<debris.length;i++){ var d=debris[i]; if(d.a<=0) continue;
      d.vy+=900*dt; d.x+=d.vx*dt; d.y+=d.vy*dt; d.rot+=d.vr*dt; d.a-=dt*0.9;
    }
    // sparks physics
    for(var s=0;s<sparks.length;s++){ var sp=sparks[s]; if(sp.a<=0) continue;
      sp.vy+=520*dt; sp.x+=sp.vx*dt; sp.y+=sp.vy*dt; sp.a-=dt*1.6;
    }
    if(debris.length>60) debris=debris.filter(function(d){return d.a>0;});
    if(sparks.length>120) sparks=sparks.filter(function(s){return s.a>0;});

    render();
    requestAnimationFrame(loop);
  }

  // ---- FINNY contract footer ----
  var CA='0x7C793B3372FD53Cc8c616aeD9144e1C3b663321B';
  var foot=document.getElementById('foot');
  if(foot){ foot.addEventListener('pointerdown', function(e){ e.stopPropagation(); }); }
  var caBtn=document.getElementById('caBtn'), caText=document.getElementById('caText');
  if(caBtn){ caBtn.addEventListener('click', function(e){ e.stopPropagation();
    var old='0x7C79…321B';
    function done(){ caText.textContent='COPIED ✓'; setTimeout(function(){ caText.textContent=old; },1100); }
    function fallback(){ try{ var t=document.createElement('textarea'); t.value=CA; t.setAttribute('readonly',''); t.style.position='absolute'; t.style.left='-9999px'; document.body.appendChild(t); t.select(); document.execCommand('copy'); document.body.removeChild(t); done(); }catch(_){} }
    try{ if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(CA).then(done, fallback); } else { fallback(); } }catch(err){ fallback(); }
  }); }

  // boot
  resize();
  elBestHud.textContent=best; elBestStart.textContent=best; elBestOver.textContent=best;
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
